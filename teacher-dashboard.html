<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Teacher Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">100</div>
        <span>Percent</span>
      </a>

      <nav class="main-nav">
        <a href="for-teachers.html" class="nav-link">For Teachers</a>
        <a href="for-schools.html" class="nav-link">For Schools</a>
        <a href="for-students.html" class="nav-link">For Students</a>
        <a href="about-us.html" class="nav-link">About Us</a>
        <a href="pricing.html" class="nav-link">Pricing</a>
        <a href="contact-us.html" class="nav-link">Contact Us</a>
      </nav>

      <div class="header-actions">
        <a href="https://github.com" class="btn-outline-nav btn-sm" target="_blank" rel="noopener noreferrer" title="View on GitHub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-4.77 0-0.84-0.33-1.14-0.33-1.85h-0.05c-0.27-0.65-0.97-0.97-1.82-0.97-1.12 0-1.82 0.3-2.67 0.65v-2.03c-0.38 0.44-0.89 0.72-1.53 0.84-0.32 0.06-0.65 0.06-0.97 0.06-0.32 0-0.65-0.06-0.97-0.06-0.64-0.12-1.15-0.4-1.53-0.84v2.03c-0.85-0.35-1.55-0.65-2.67-0.65-0.85 0-1.55 0.32-1.82 0.97h-0.05c0-0.71-0.33-1.01-0.33-1.85 0-3.23 3.3-4.42 6.44-4.77a3.37 3.37 0 0 0-.94 2.61v3.87a3 3 0 0 1-0.94 2.91c-0.94 0.25-1.82 0.49-2.67 0.65-0.32 0.06-0.65 0.06-0.97 0.06-0.32 0-0.65-0.06-0.97-0.06-0.85 0-1.55 0.32-1.82 0.65a3.37 3.37 0 0 0-.94 2.91v3.87a3 3 0 0 1 0.94 2.91c0.94 0.25 1.82 0.49 2.67 0.65 0.32 0.06 0.65 0.06 0.97 0.06 0.32 0 0.65-0.06 0.97-0.06 0.85 0 1.55-0.32 1.82-0.65a3.37 3.37 0 0 0 0.94-2.91v-3.87a3 3 0 0 1 0.94-2.91c0.85 0.25 1.72 0.49 2.67 0.65 0.32 0.06 0.65 0.06 0.97 0.06 0.32 0 0.65-0.06 0.97-0.06 0.85 0 1.55-0.32 1.82-0.65a3.37 3.37 0 0 0 0.94-2.91v-3.87z"></path>
          </svg>
        </a>
        <div class="header-user">
          <span class="user-name">Teacher</span>
          <div class="user-avatar">T</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Teacher Dashboard -->
  <div class="dashboard-page">
    <div class="dashboard-header">
      <div class="user-profile">
        <div class="user-avatar-lg">T</div>
        <div class="user-info">
          <div class="user-name-dashboard">Teacher</div>
          <div class="user-school">Gordon's School</div>
        </div>
      </div>

      <!-- Teacher stats -->
      <div class="dashboard-stats">
        <div class="dashboard-stat">
          <div class="dashboard-stat-label">Groups</div>
          <div class="dashboard-stat-value gold" id="statGroups">0</div>
        </div>
        <div class="dashboard-stat">
          <div class="dashboard-stat-label">Students</div>
          <div class="dashboard-stat-value" id="statStudents">0</div>
        </div>
        <div class="dashboard-stat">
          <div class="dashboard-stat-label">Assignments</div>
          <div class="dashboard-stat-value" id="statAssignments">0</div>
        </div>
      </div>
    </div>

    <div class="dashboard-content">
      <!-- Create Group -->
      <div class="dashboard-section">
        <div class="section-header-dashboard">
          <div class="section-title-dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
            </svg>
            Create Group
          </div>
        </div>
        <div class="create-group-card">
          <div class="form-group">
            <label class="form-label" for="newGroupName">Group name</label>
            <input type="text" class="form-input" id="newGroupName" placeholder="e.g. Year 11 Set 1" />
          </div>
          <button class="btn btn-primary btn-lg create-group-btn">Create Group</button>
        </div>
      </div>

      <!-- Groups List -->
      <div class="dashboard-section">
        <div class="section-header-dashboard">
          <div class="section-title-dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="1" x2="4" y2="23"></line>
              <line x1="20" y1="1" x2="20" y2="23"></line>
              <line x1="1" y1="4" x2="23" y2="4"></line>
              <line x1="1" y1="20" x2="23" y2="20"></line>
            </svg>
            Your Groups
          </div>
        </div>
        <div class="groups-list" id="groupsList">
          <!-- Groups populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/teacher-dashboard.js"></script>
</body>
</html>
