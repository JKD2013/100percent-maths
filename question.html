<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/styles.css" />

<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">100</div>
        <span>Percent</span>
      </a>
      
      <div class="header-actions">
        <a href="https://github.com" class="btn-outline-nav btn-sm" target="_blank" rel="noopener noreferrer" title="View on GitHub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          </svg>
        </a>
        <div class="header-user">
          <span class="user-name">Jai</span>
          <div class="user-avatar">J</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Question Page -->
  <div class="question-page">
    <div class="question-header">
      <button class="exit-task-btn" onclick="window.location.href='task.html'">Exit task</button>
    </div>
    
    <div class="question-container">
      <div class="question-nav">
        <button class="q-button current">1</button>
        <button class="q-button active">2</button>
        <button class="q-button active">3</button>
        <button class="q-button active">4</button>
        <button class="q-button active">5</button>
        <button class="q-button">6</button>
        <button class="q-button">7</button>
        <button class="q-button">8</button>
        <button class="q-button">9</button>
        <button class="q-button">10</button>
        <button class="q-button">11</button>
        <button class="q-button">12</button>
        <button class="q-button">13</button>
        <button class="q-button">14</button>
        <button class="q-button">15</button>
      </div>
      
      <div class="question-card">
        <div class="question-topic">394h Raise a number to the power of a negative fraction.</div>
        
        <div class="question-text">
          Write down the value of
        </div>
        
        <div class="question-expression">
          81<sup>-1/2</sup>
        </div>
        
        <div class="question-answer-wrapper">
          <input type="text" class="question-answer-input" placeholder="0" />
        </div>
        
        <button class="submit-answer-btn">Submit Answer</button>
        
        <a href="#" class="watch-video">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Watch video
        </a>
      </div>
    </div>
  </div>

  <!-- Libraries: Three.js → Vanta → Lenis → GSAP (load order matters) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/question.js"></script>
</body>
</html>
