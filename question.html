<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Question</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="dashboard.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="leaderboard.html" class="hud-nav">Leaderboard</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">03 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">Operating</span>
    </div>
  </div>

  <!-- Question Page -->
  <div class="app-shell">
    <!-- Sticky progress header -->
    <div class="question-sticky">
      <div class="progress-wrap">
        <div class="progress-label">Progress</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="counter-chip">
          <span id="questionCurrent">1</span>
          <span class="counter-sep">/</span>
          <span id="questionTotal">5</span>
        </div>
      </div>
      <div class="xp-chip">
        <span class="question-xp-label">XP</span>
        <span class="xp-value" id="questionXp">0</span>
      </div>
    </div>

    <!-- Adaptive header (difficulty meter + session stats) -->
    <div class="adaptive-header">
      <div class="difficulty-meter">
        <span class="difficulty-label" id="difficultyLabel">Medium</span>
        <div class="difficulty-bar">
          <div class="difficulty-fill medium" id="difficultyFill"></div>
        </div>
      </div>
    </div>

    <div class="session-stats">
      <div class="session-stat">
        <span class="session-stat-label">Correct</span>
        <span class="session-stat-value" id="statCorrect">0</span>
      </div>
      <div class="session-stat">
        <span class="session-stat-label">Streak</span>
        <span class="session-stat-value" id="statStreak">0</span>
      </div>
      <div class="session-stat">
        <span class="session-stat-label">XP</span>
        <span class="session-stat-value" id="statXp">0</span>
      </div>
    </div>

    <div class="question-area">
      <div class="question-card adaptive-question-card">
        <div class="question-header-row">
          <div class="question-topic" id="questionTopic">Topic</div>
          <div class="xp-chip">
            <span class="question-xp-label">Score</span>
            <span class="xp-value" id="questionScore">0/5</span>
          </div>
        </div>

        <div class="question-type-badge" id="questionTypeBadge">KS3</div>

        <div class="question-text-block" id="questionText">Write down the value of</div>

        <div class="question-expression-block" id="questionExpression">3<sup>-2</sup></div>

        <div class="answer-input-wrap">
          <input type="text" class="question-answer-input" placeholder="Type your answer" autocomplete="off" />
        </div>

        <div class="submit-btn-row">
          <button class="submit-btn-main btn btn-primary btn-bracket" id="submitBtn">Submit Answer</button>
        </div>

        <a href="#" class="watch-video" id="watchVideoLink">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Watch video
        </a>

        <!-- Hint system -->
        <div class="hint-system">
          <div class="hint-header">
            <span>Hint</span>
            <span id="hintsRemaining">(3 left)</span>
          </div>
          <button class="hint-btn" id="hintBtn">
            <span>Reveal hint</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 3 2 12"></polyline>
            </svg>
          </button>
          <div id="hint1" class="hint-content"></div>
          <div id="hint2" class="hint-content"></div>
          <div id="hint3" class="hint-content"></div>
        </div>

        <!-- Explanation panel (shown after answer) -->
        <div class="explanation-panel" id="explanationPanel">
          <div class="explanation-header">
            <span>Worked explanation</span>
          </div>
          <div class="explanation-content" id="explanationContent"></div>
          <div class="explanation-answer" id="explanationAnswer"></div>
        </div>

        <!-- Feedback overlay -->
        <div class="feedback-overlay" id="questionFeedback">
          <div class="feedback-icon" id="feedbackIcon">✓</div>
          <div id="feedbackMessage">Correct!</div>
        </div>
      </div>
    </div>

    <div class="question-nav">
      <!-- Question number buttons injected by JS -->
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/adaptive-task.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

</body>
</html>
