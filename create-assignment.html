<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Create Assignment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="group-detail.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="leaderboard.html" class="hud-nav">Leaderboard</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">09 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">Assigning</span>
    </div>
  </div>

  <!-- Create Assignment Page -->
  <div class="app-shell">
    <div class="app-layout">
      <aside class="app-rail">
        <div class="rail-user">
          <div class="rail-avatar" id="railAvatar">T</div>
          <div class="rail-info">
            <div class="rail-name" id="railName">Teacher</div>
            <div class="rail-school">Gordon's School</div>
          </div>
        </div>

        <div class="rail-stats">
          <div class="rail-stat">
            <div class="rail-stat-label">Questions</div>
            <div class="rail-stat-value gold" id="questionCount">0</div>
          </div>
        </div>

        <div class="rail-divider"></div>

        <button class="rail-signout" onclick="signOut()">Sign Out</button>
      </aside>

      <main class="app-main">
        <div class="app-container">

          <section class="page-section">
            <div class="section-header">
              <div class="section-kicker">Create</div>
              <h2 class="section-title">New Assignment</h2>
            </div>
            <div class="create-card">
              <div class="form-group">
                <label class="form-label" for="assignmentTitle">Assignment title</label>
                <input type="text" class="form-input" id="assignmentTitle" placeholder="e.g. Week 5 Homework" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="assignmentDueDate">Due date</label>
                <input type="date" class="form-input" id="assignmentDueDate" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="assignmentQuestions">Select questions</label>
                <div class="questions-list" id="questionsList"></div>
              </div>
              <button class="btn btn-primary btn-lg btn-bracket btn-full" id="createAssignmentBtn">Create Assignment</button>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/create-assignment.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

</body>
</html>
