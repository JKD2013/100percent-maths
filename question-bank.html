<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Question Bank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="teacher-dashboard.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="leaderboard.html" class="hud-nav">Leaderboard</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">06 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">Authoring mode</span>
    </div>
  </div>

  <!-- Question Bank Page -->
  <div class="app-shell">
    <div class="app-layout">
      <aside class="app-rail">
        <div class="rail-user">
          <div class="rail-avatar" id="railAvatar">T</div>
          <div class="rail-info">
            <div class="rail-name" id="railName">Teacher</div>
            <div class="rail-school">Gordon's School</div>
          </div>
        </div>

        <div class="rail-stats">
          <div class="rail-stat">
            <div class="rail-stat-label">Created</div>
            <div class="rail-stat-value gold" id="statQuestionsCreated">0</div>
          </div>
          <div class="rail-stat">
            <div class="rail-stat-label">Public</div>
            <div class="rail-stat-value" id="statPublicQuestions">0</div>
          </div>
          <div class="rail-stat">
            <div class="rail-stat-label">Private</div>
            <div class="rail-stat-value" id="statPrivateQuestions">0</div>
          </div>
        </div>

        <div class="rail-divider"></div>

        <button class="rail-signout" onclick="signOut()">Sign Out</button>
      </aside>

      <main class="app-main">
        <div class="app-container">

          <section class="page-section">
            <div class="section-header">
              <div class="section-kicker">Create</div>
              <h2 class="section-title">New Question</h2>
            </div>
            <div class="create-card">
              <div class="form-group">
                <label class="form-label" for="qbTopic">Topic</label>
                <select class="form-input" id="qbTopic" required>
                  <option value="">Select topic&hellip;</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="qbExpression">Expression / Question</label>
                <input type="text" class="form-input" id="qbExpression" placeholder="e.g. 3^-2 or √50" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="qbPrompt">Prompt / Instruction</label>
                <input type="text" class="form-input" id="qbPrompt" placeholder="e.g. Evaluate." required />
              </div>
              <div class="form-group">
                <label class="form-label" for="qbAnswer">Correct Answer</label>
                <input type="text" class="form-input" id="qbAnswer" placeholder="e.g. 1/9" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="qbHint">Hint (optional)</label>
                <input type="text" class="form-input" id="qbHint" placeholder="Hint&hellip;" />
              </div>
              <div class="form-group">
                <label class="form-label" for="qbExplanation">Explanation (optional)</label>
                <input type="text" class="form-input" id="qbExplanation" placeholder="Why this is correct&hellip;" />
              </div>
              <div class="form-group">
                <label class="form-label" for="qbDifficulty">Difficulty</label>
                <select class="form-input" id="qbDifficulty">
                  <option value="1">1 &mdash; Easy</option>
                  <option value="2">2</option>
                  <option value="3" selected>3 &mdash; Medium</option>
                  <option value="4">4</option>
                  <option value="5">5 &mdash; Hard</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="qbType">Question Type</label>
                <select class="form-input" id="qbType">
                  <option value="text_input">Text Input</option>
                  <option value="multiple_choice">Multiple Choice</option>
                  <option value="true_false">True / False</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" style="display:flex; align-items:center; gap:8px;">
                  <input type="checkbox" id="qbPublic" />
                  <span>Make public (share with all teachers)</span>
                </label>
              </div>
              <button class="btn btn-primary btn-lg btn-bracket btn-full" id="createQuestionBtn">Create Question</button>
            </div>
          </section>

          <section class="page-section">
            <div class="section-header">
              <div class="section-kicker">Library</div>
              <h2 class="section-title">My Question Bank</h2>
            </div>
            <div class="question-bank-list" id="questionsBankList"></div>
          </section>

        </div>
      </main>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/question-bank.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

</body>
</html>
