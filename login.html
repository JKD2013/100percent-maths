<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="index.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="for-teachers.html" class="hud-nav">For Teachers</a>
      <a href="for-students.html" class="hud-nav">For Students</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">01 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">System nominal</span>
    </div>
  </div>

  <!-- Sign in panel — left rail -->
  <div class="auth-page">
    <div class="auth-rail">
      <a href="index.html" class="auth-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Home
      </a>

      <div class="auth-brand">
        <div class="logo-mark">100</div>
        <span>Percent</span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title" id="authTitle">Welcome back</h1>
        <p class="auth-desc" id="authDesc">Sign in to continue your mathematical journey.</p>
      </div>

      <!-- Sign In Form -->
      <form class="auth-form" id="signInForm">
        <div class="form-group">
          <label class="form-label" for="signinEmail">Email address</label>
          <input type="email" class="form-input" id="signinEmail" placeholder="name@school.edu" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signinPassword">Password</label>
          <div class="password-wrapper">
            <input type="password" class="form-input" id="signinPassword" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggleSigninPassword" aria-label="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <p class="field-error" id="signinEmailError"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-bracket btn-full" id="signinSubmitBtn">Sign in</button>

        <div class="auth-help">
          <a href="#" id="forgotPasswordLink">Having trouble signing in?</a>
        </div>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="divider-line"></span>
        <span class="divider-text">Or continue with</span>
        <span class="divider-line"></span>
      </div>

      <!-- OAuth buttons -->
      <div class="oauth-buttons">
        <button type="button" class="btn oauth-btn oauth-google" id="oauthGoogleBtn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#4285F4" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#F4B400" d="M5.84 14.09c-.22-.62-.35-1.3-.35-2.09s.13-1.47.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#0F9D58" d="M12 5.38c1.62 0 3.06 .56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>

        <button type="button" class="btn oauth-btn oauth-microsoft" id="oauthMicrosoftBtn">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <rect x="2" y="2" width="8" height="8" fill="#F25022"/>
            <rect x="14" y="2" width="8" height="8" fill="#7FBA00"/>
            <rect x="2" y="14" width="8" height="8" fill="#00A4EF"/>
            <rect x="14" y="14" width="8" height="8" fill="#FFB900"/>
          </svg>
          Sign in with Microsoft
        </button>
      </div>

      <div class="auth-switch">
        <span id="switchPrompt">New to 100Percent?</span>
        <a href="signup.html" id="switchToSignup">Create an account</a>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth-login.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

</body>
</html>
