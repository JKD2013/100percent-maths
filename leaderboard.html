<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="dashboard.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="question-bank.html" class="hud-nav">Question Bank</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">05 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">Rankings live</span>
    </div>
  </div>

  <!-- Leaderboard Page -->
  <div class="app-shell">
    <div class="app-layout">
      <aside class="app-rail">
        <div class="rail-user">
          <div class="rail-avatar" id="railAvatar">S</div>
          <div class="rail-info">
            <div class="rail-name" id="railName">Student</div>
            <div class="rail-school">Gordon's School</div>
          </div>
        </div>

        <div class="rail-stats">
          <div class="rail-stat">
            <div class="rail-stat-label">Rank</div>
            <div class="rail-stat-value gold" id="statRank">-</div>
          </div>
          <div class="rail-stat">
            <div class="rail-stat-label">League</div>
            <div class="rail-stat-value" id="statLeague">-</div>
          </div>
          <div class="rail-stat">
            <div class="rail-stat-label">Week XP</div>
            <div class="rail-stat-value" id="statWeekXP">0</div>
          </div>
        </div>

        <div class="rail-divider"></div>

        <div class="rail-section">
          <div class="rail-section-title">Badges</div>
          <div class="badges-list" id="badgesList"></div>
        </div>

        <button class="rail-signout" onclick="signOut()">Sign Out</button>
      </aside>

      <main class="app-main">
        <div class="app-container">

          <section class="page-section">
            <div class="section-header">
              <div class="section-kicker">Rankings</div>
              <h2 class="section-title">Weekly Leaderboard</h2>
            </div>
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Student</th>
                  <th>XP This Week</th>
                  <th>Questions</th>
                </tr>
              </thead>
              <tbody id="leaderboardBody"></tbody>
            </table>
          </section>

        </div>
      </main>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/leaderboard.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

</body>
</html>
