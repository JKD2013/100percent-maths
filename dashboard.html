<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100Percent - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fixed HUD -->
  <div class="hud">
    <div class="hud-tl">
      <a href="index.html" class="logo">
        <div class="logo-mark">100</div>
        <span class="logo-word">Percent</span>
      </a>
    </div>
    <div class="hud-tr">
      <a href="leaderboard.html" class="hud-nav">Leaderboard</a>
      <a href="question-bank.html" class="hud-nav">Question Bank</a>
      <a href="https://github.com/JKD2013/100percent-maths" target="_blank" rel="noopener noreferrer" class="hud-nav hud-nav-github">GitHub</a>
    </div>
    <div class="hud-bl">
      <span class="mono-label">02 <span class="cue-arrow">▾</span></span>
    </div>
    <div class="hud-br">
      <span class="dot"></span><span class="mono-label">Session active</span>
    </div>
  </div>

  <!-- Dashboard — left rail instrumentation, right content -->
  <div class="dashboard-app">
    <aside class="dashboard-rail">
      <div class="rail-user">
        <div class="rail-avatar" id="railAvatar">S</div>
        <div class="rail-info">
          <div class="rail-name" id="railName">Student</div>
          <div class="rail-school">Gordon's School</div>
        </div>
      </div>

      <div class="rail-stats">
        <div class="rail-stat">
          <div class="rail-stat-label">XP</div>
          <div class="rail-stat-value gold" id="statXp">0</div>
        </div>
        <div class="rail-stat">
          <div class="rail-stat-label">Level</div>
          <div class="rail-stat-value" id="statLevel">1</div>
        </div>
        <div class="rail-stat">
          <div class="rail-stat-label">Streak</div>
          <div class="rail-stat-value" id="statStreak">0</div>
        </div>
        <div class="rail-stat">
          <div class="rail-stat-label">Mastery</div>
          <div class="rail-stat-value" id="statMastery">0%</div>
        </div>
      </div>

      <div class="rail-divider"></div>

      <div class="rail-tasks">
        <div class="rail-section-title">Next</div>
        <div class="rail-task" id="railTaskEmpty" style="display:none;">
          <div class="rail-task-title">No active task</div>
        </div>
        <div class="rail-task" id="railTaskActive">
          <div class="rail-task-number">01</div>
          <div class="rail-task-info">
            <div class="rail-task-title" id="railTaskTitle">—</div>
            <button class="rail-task-btn" id="railTaskBtn">Open task</button>
          </div>
        </div>
      </div>

      <div class="rail-divider"></div>

      <div class="rail-section">
        <div class="rail-section-title">Trophies</div>
        <div class="rail-trophies" id="railTrophies"></div>
        <div class="rail-trophy-count">
          <span class="rail-trophy-label">Earned</span>
          <span class="rail-trophy-value" id="railTrophyCount">0</span>
        </div>
      </div>

      <button class="rail-signout" onclick="signOut()">Sign Out</button>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-container">

        <!-- Mastery by topic -->
        <section class="dashboard-section">
          <div class="section-header">
            <div class="section-kicker">Mastery</div>
            <h2 class="section-title">Topics</h2>
          </div>
          <div class="mastery-grid" id="masteryGrid"></div>
        </section>

        <!-- Completed tasks -->
        <section class="dashboard-section">
          <div class="section-header">
            <div class="section-kicker">History</div>
            <h2 class="section-title">Completed tasks</h2>
          </div>
          <div class="tasks-list" id="tasksList"></div>
          <div class="empty-state" id="emptyHistory" style="display:none;">
            <p>No completed tasks yet.</p>
          </div>
        </section>

        <!-- Badges -->
        <section class="dashboard-section">
          <div class="section-header">
            <div class="section-kicker">Badges</div>
            <h2 class="section-title">Achievements</h2>
          </div>
          <div class="badges-list" id="badgesList"></div>
        </section>

      </div>
    </main>
  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/join-group.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg) {
        console.log('Service worker registered:', reg);
      }).catch(function(err) {
        console.log('Service worker registration failed:', err);
      });
    }
  </script>

  
<script>
  // Load badges for dashboard
  (function() {
    if (typeof sb === 'undefined') return;
    requireSession(function(session) {
      sb.from('user_badges')
        .select('badge_id')
        .eq('student_id', session.user.id)
        .then(function(ref) {
          var earnedBadgeIds = (ref.data || []).map(function(b) { return b.badge_id; });
          sb.from('badges').select('*').then(function(ref2) {
            var allBadges = ref2.data || [];
            var list = document.getElementById('badgesList');
            if (!list) return;
            list.innerHTML = '';
            allBadges.forEach(function(badge) {
              var earned = earnedBadgeIds.includes(badge.id);
              var card = document.createElement('div');
              card.className = 'badge-card ' + (earned ? 'earned' : 'badge-locked');
              card.innerHTML =
                '<div class="badge-icon">' + (badge.icon || '🏅') + '</div>' +
                '<div class="badge-name">' + (badge.name || '') + '</div>' +
                '<div class="badge-description">' + (badge.description || '') + '</div>' +
                '<div class="badge-criteria">' + badge.criteria_value + ' required</div>';
              list.appendChild(card);
            });
          });
        });
    });
  })();
</script>

  </body>
</html>
